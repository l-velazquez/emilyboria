    <style>
      /* ── Reset & Custom Properties ── */
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #fffdf8;
        --text: #2d1810;
        --text-muted: #8b6914;
        --orange: #ff9a2e;
        --orange-deep: #ff7a1a;
        --red-orange: #ff5733;
        --yellow: #ffd234;
        --yellow-light: #ffe680;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        background: var(--bg);
        background-image: radial-gradient(
          ellipse at 50% 45%,
          #fff5e6 0%,
          var(--bg) 70%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        min-height: 100vh;
        min-height: 100dvh;
      }

      /* ── Decorative Flowers ── */
      .flowers {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 0;
        pointer-events: none;
      }

      .flower {
        position: absolute;
        opacity: 0;
        will-change: transform;
      }

      /* ── Flower Placement ── */
      .flower--1 {
        width: 380px;
        height: 380px;
        top: -8%;
        left: -6%;
        animation:
          flower-in-55 1.2s 0s ease-out forwards,
          breathe-1 24s 1.2s ease-in-out infinite alternate;
      }

      .flower--2 {
        width: 420px;
        height: 420px;
        bottom: -10%;
        right: -8%;
        animation:
          flower-in-50 1.2s 0.15s ease-out forwards,
          breathe-2 28s 1.35s ease-in-out infinite alternate;
      }

      .flower--3 {
        width: 260px;
        height: 260px;
        top: -5%;
        right: -4%;
        animation:
          flower-in-30 1.2s 0.3s ease-out forwards,
          breathe-3 22s 1.5s ease-in-out infinite alternate;
      }

      .flower--4 {
        width: 300px;
        height: 300px;
        bottom: -6%;
        left: -5%;
        animation:
          flower-in-35 1.2s 0.45s ease-out forwards,
          breathe-4 26s 1.65s ease-in-out infinite alternate;
      }

      .flower--5 {
        width: 160px;
        height: 160px;
        top: 40%;
        left: -3%;
        animation:
          flower-in-20 1.2s 0.6s ease-out forwards,
          breathe-5 20s 1.8s ease-in-out infinite alternate;
      }

      .flower--6 {
        width: 200px;
        height: 200px;
        bottom: 15%;
        right: -2%;
        animation:
          flower-in-25 1.2s 0.75s ease-out forwards,
          breathe-6 30s 1.95s ease-in-out infinite alternate;
      }

      /* ── Flower Fade-In (each targets a unique final opacity) ── */
      @keyframes flower-in-55 {
        from {
          opacity: 0;
          transform: scale(0.85);
        }
        to {
          opacity: 0.55;
          transform: scale(1);
        }
      }

      @keyframes flower-in-50 {
        from {
          opacity: 0;
          transform: scale(0.85);
        }
        to {
          opacity: 0.5;
          transform: scale(1);
        }
      }

      @keyframes flower-in-35 {
        from {
          opacity: 0;
          transform: scale(0.85);
        }
        to {
          opacity: 0.35;
          transform: scale(1);
        }
      }

      @keyframes flower-in-30 {
        from {
          opacity: 0;
          transform: scale(0.85);
        }
        to {
          opacity: 0.3;
          transform: scale(1);
        }
      }

      @keyframes flower-in-25 {
        from {
          opacity: 0;
          transform: scale(0.85);
        }
        to {
          opacity: 0.25;
          transform: scale(1);
        }
      }

      @keyframes flower-in-20 {
        from {
          opacity: 0;
          transform: scale(0.85);
        }
        to {
          opacity: 0.2;
          transform: scale(1);
        }
      }

      /* ── Ambient Breathing (slow, unique per flower) ── */
      @keyframes breathe-1 {
        from {
          transform: rotate(0deg) scale(1);
        }
        to {
          transform: rotate(3deg) scale(1.03);
        }
      }

      @keyframes breathe-2 {
        from {
          transform: rotate(0deg) scale(1);
        }
        to {
          transform: rotate(-2.5deg) scale(1.04);
        }
      }

      @keyframes breathe-3 {
        from {
          transform: rotate(0deg) scale(1);
        }
        to {
          transform: rotate(2deg) scale(1.02);
        }
      }

      @keyframes breathe-4 {
        from {
          transform: rotate(0deg) scale(1);
        }
        to {
          transform: rotate(-3deg) scale(1.03);
        }
      }

      @keyframes breathe-5 {
        from {
          transform: rotate(0deg) scale(1);
        }
        to {
          transform: rotate(2.5deg) scale(1.05);
        }
      }

      @keyframes breathe-6 {
        from {
          transform: rotate(0deg) scale(1);
        }
        to {
          transform: rotate(-2deg) scale(1.03);
        }
      }

      /* ── Center Content ── */
      .content {
        position: relative;
        z-index: 1;
        text-align: center;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* ── Portrait ── */
      .portrait {
        width: clamp(160px, 20vw, 220px);
        height: clamp(160px, 20vw, 220px);
        border-radius: 50%;
        padding: 4px;
        background: linear-gradient(135deg, var(--orange), var(--yellow));
        box-shadow: 0 8px 32px rgba(255, 154, 46, 0.2);
        margin-bottom: 1.5rem;
        opacity: 0;
        animation: reveal 0.8s 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .portrait img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        display: block;
      }

      /* ── Name ── */
      .name {
        font-family: "Mrs Saint Delafield", cursive;
        font-weight: 400;
        font-style: normal;
        line-height: 1.15;
      }

      .name__first {
        display: block;
        font-size: clamp(2.5rem, 2rem + 5vw, 5.5rem);
        color: var(--text);
        opacity: 0;
        animation: reveal 0.7s 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .name__last {
        display: block;
        font-size: clamp(2rem, 1.5rem + 4vw, 4.5rem);
        background: linear-gradient(
          135deg,
          var(--orange),
          var(--red-orange),
          var(--yellow)
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        opacity: 0;
        animation: reveal 0.7s 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* ── Subtitle ── */
      .subtitle {
        font-family: "Josefin Sans", sans-serif;
        font-weight: 400;
        font-size: clamp(0.65rem, 0.5rem + 0.7vw, 0.9rem);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-top: 0.8rem;
        opacity: 0;
        animation: reveal 0.6s 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* ── CV Button ── */
      .cv-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 2rem;
        padding: 0.9rem 2.4rem;
        font-family: "Josefin Sans", sans-serif;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        text-decoration: none;
        color: #ffffff;
        background: linear-gradient(135deg, var(--orange), var(--red-orange));
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(255, 87, 51, 0.3);
        opacity: 0;
        animation: reveal 0.6s 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease;
      }

      .cv-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 24px rgba(255, 87, 51, 0.4);
      }

      .cv-btn:active {
        transform: translateY(0);
        box-shadow: 0 2px 8px rgba(255, 87, 51, 0.3);
      }

      .cv-btn:focus-visible {
        outline: 2px solid var(--orange);
        outline-offset: 3px;
      }

      .cv-btn__icon {
        width: 16px;
        height: 16px;
      }

      /* ── Language switcher ── */
      .lang-switch {
        position: fixed;
        top: 1rem;
        right: 1.25rem;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-family: "Josefin Sans", sans-serif;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        color: rgba(45, 24, 16, 0.35);
      }

      .lang-switch a {
        display: flex;
        align-items: center;
        min-height: 44px;
        padding: 0 0.2rem;
        color: var(--text-muted);
        text-decoration: none;
        transition: color 0.2s;
      }

      .lang-switch a:hover {
        color: var(--orange);
      }

      .lang-switch a:focus-visible {
        outline: 2px solid var(--orange);
        outline-offset: 3px;
        border-radius: 3px;
      }

      .lang-switch [aria-current="true"] {
        color: var(--text);
      }

      /* ── Content Entrance ── */
      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ── Responsive ── */
      @media (max-width: 768px) {
        .flower--5,
        .flower--6 {
          display: none;
        }
      }

      @media (max-width: 480px) {
        .portrait {
          width: 150px;
          height: 150px;
        }
      }

      /* ── Reduced Motion ── */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-delay: 0ms !important;
          animation-iteration-count: 1 !important;
        }

        .flower--1 {
          opacity: 0.55;
        }
        .flower--2 {
          opacity: 0.5;
        }
        .flower--3 {
          opacity: 0.3;
        }
        .flower--4 {
          opacity: 0.35;
        }
        .flower--5 {
          opacity: 0.2;
        }
        .flower--6 {
          opacity: 0.25;
        }

        .portrait,
        .name__first,
        .name__last,
        .subtitle,
        .cv-btn {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
